review_findings:
  # Three or more. One line each, and each one names what it is about: an F-rule (F1-F5),
  # an AC (AC1-AC6), a boundary test (B1-B6), INT, or a file.
  # Worthless:        "The refactoring improved the code"
  # Worth everything: "F2: the assistant's filter used equipment.some(), so a room with only a projector
  #                    matched projector + whiteboard; the F2 test caught it"
  - "INT: the assistant's draft test called checkRoom on the whole catalog, not on what filterRooms returned, so it could not catch a filtered-out room shown as available; I changed it to checkRoom(result, ...) and added the filtered-out room b"
  - "F2: I worked out the projector + whiteboard result (rooms a and c) by hand before filter.ts existed; the test was red first (Cannot find module './filter') and green after filterRooms used every(), not some()"
  - "src/booking.ts: the review found that rejectionReasons still restates the AC1-AC4 conditions to word them; I reported it as the remaining limitation in report section 7 instead of counting it as removed duplication"

honesty:
  baseline_unchanged: yes  # yes | no   app/ at the baseline commit is the starting point as it was
  runs_unedited: yes  # yes | no   every run in report.md is pasted from a real terminal
  no_invented_metrics: yes  # yes | no   every number in section 7 was measured as the row says
  ai_usage_disclosed: yes  # yes | no   AI_USAGE.md and section 8 are complete
